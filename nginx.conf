server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Single-page app: unknown paths fall back to index.html so client-side (react-router)
	# routes resolve on a full-page load / refresh instead of 404-ing.
	location / {
		try_files $uri $uri/ /index.html;
	}

	# Long-cache the fingerprinted build assets; never cache the HTML entry point.
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}
	location = /index.html {
		add_header Cache-Control "no-cache";
	}
}
